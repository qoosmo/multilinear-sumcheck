[package]
name        = "multilinear-sumcheck"
version     = "0.1.0"
edition     = "2021"
authors     = ["Ali Mkhida <ali@algorizk.com>", "Adil Iguider <adil@inpt.ac.ma>"]
description = "Basis-aware multilinear polynomial algorithms and the Sumcheck protocol in Rust"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/qoosmo/multilinear-sumcheck"
homepage    = "https://github.com/qoosmo/multilinear-sumcheck"
readme      = "README.md"
keywords    = ["cryptography", "sumcheck", "multilinear", "zkp", "zero-knowledge"]
categories  = ["cryptography", "mathematics"]

[lib]
name = "multilinear_sumcheck"
path = "src/lib.rs"

[[bench]]
name    = "sumcheck"
harness = false

[dependencies]
ark-ff    = "0.4"
ark-bn254 = "0.4"
ark-std   = "0.4"
rayon     = "1.8"

[dev-dependencies]
ark-poly  = { version = "0.4", features = ["parallel"] }
criterion = { version = "0.5", features = ["html_reports"] }
rand      = "0.8"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"

[profile.bench]
inherits = "release"
debug    = true
